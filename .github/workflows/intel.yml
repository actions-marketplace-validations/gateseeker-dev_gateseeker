name: Intel feed

# Collects public security feeds and opens a pull request with proposed
# advisory records. Nothing is merged automatically; a human reviews every PR.
# This is the only workflow with write permissions, and it uses only the
# repository's own GITHUB_TOKEN.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: intel-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: an open intel branch is merged with main before collecting on top of it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # One review queue: while an intel pull request is open, new proposals are added to it instead of
      # waiting. (Until 2026-11-13 the run was skipped, so one unreviewed PR stopped collection for two weeks.)
      - name: Continue the open intel pull request, if any
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "gateseeker-intel[bot]"
          git config user.email "gateseeker-intel@users.noreply.github.com"
          BRANCH="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("intel/")) | .headRefName] | sort | .[0] // ""')"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          if [ -z "${BRANCH}" ]; then exit 0; fi
          git fetch origin "${BRANCH}"
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          # Decisions merged on main since the branch was opened must count as already seen.
          if ! git merge --no-edit origin/main; then
            git merge --abort
            echo "::warning::The open intel pull request (${BRANCH}) does not merge with main; review it in the triage interface. Nothing was collected."
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect feeds
        if: steps.open.outputs.blocked != '1'
        run: node dist/intel-cli.js collect --summary-file /tmp/intel-summary.txt

      - name: Validate records
        if: steps.open.outputs.blocked != '1'
        run: node dist/intel-cli.js validate

      - name: Open or update the pull request when there are proposals
        if: steps.open.outputs.blocked != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_BRANCH: ${{ steps.open.outputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- advisories/proposed && [ -z "$(git ls-files --others --exclude-standard advisories/proposed)" ]; then
            echo "No new proposals."
            if [ -n "${OPEN_BRANCH}" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${OPEN_BRANCH}")" ]; then git push origin "${OPEN_BRANCH}"; fi
            exit 0
          fi
          STAMP="$(date -u +%Y%m%d-%H%M)"
          git add advisories/proposed advisories/.state
          COUNT="$(git diff --cached --name-only --diff-filter=A -- advisories/proposed | wc -l | tr -d ' ')"
          git commit -m "intel: ${COUNT} proposal(s) (${STAMP})"
          if [ -n "${OPEN_BRANCH}" ]; then
            git push origin "${OPEN_BRANCH}"
            TOTAL="$(ls advisories/proposed/*.json 2>/dev/null | wc -l | tr -d ' ')"
            gh pr edit "${OPEN_BRANCH}" --title "intel: ${TOTAL} proposal(s) to review"
            { echo "${COUNT} new proposal(s) added on ${STAMP} (UTC)."; echo; echo '```'; cat /tmp/intel-summary.txt; echo '```'; } > /tmp/comment.md
            gh pr comment "${OPEN_BRANCH}" --body-file /tmp/comment.md
            exit 0
          fi
          BRANCH="intel/${STAMP}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          {
            echo "Proposed advisory records collected from public feeds. Review each file under advisories/proposed:"
            echo "fill in affected versions/tags, type, severity, summary and remediation, set status to approved or rejected,"
            echo "move the file to advisories/approved or advisories/rejected, and fill the review block."
            echo
            echo '```'
            cat /tmp/intel-summary.txt
            echo '```'
          } > /tmp/pr-body.md
          gh pr create --title "intel: ${COUNT} proposal(s) (${STAMP})" --body-file /tmp/pr-body.md --base main --head "$BRANCH" --label intel \
            || gh pr create --title "intel: ${COUNT} proposal(s) (${STAMP})" --body-file /tmp/pr-body.md --base main --head "$BRANCH"
